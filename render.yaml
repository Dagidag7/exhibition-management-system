services:
  - type: web
    name: exhibition-backend
    runtime: docker
    rootDir: exhibition-backend

    envVars:
      - key: SERVER_PORT
        value: "8888"

      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: exhibition-db
          property: connectionString

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: exhibition-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: exhibition-db
          property: password

  - type: static
    name: exhibition-frontend
    rootDir: exhibition-frontend
    buildCommand: npm install && npm run build -- --configuration production
    staticPublishPath: dist/exhibition-frontend/browser

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: exhibition-db
    databaseName: exhibition_db
    user: exhibition_system