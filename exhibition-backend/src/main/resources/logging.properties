# Java Logging Configuration - Reduce Noise

# Set default log level to WARNING (only show warnings and errors)
.level=WARNING

# Reduce C3P0 connection pool logging
com.mchange.v2.level=WARNING
com.mchange.v2.c3p0.level=WARNING

# Reduce Vert.x blocked thread checker warnings
io.vertx.core.impl.BlockedThreadChecker.level=SEVERE

# Keep application logs at INFO level
com.exhibition.level=INFO

# Console handler configuration
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %2$s - %5$s%6$s%n
